# Subversion Nuvi - Nginx Reverse Proxy Configuration
# Integrates FastAPI management API, React Web Console, and Apache mod_dav_svn backend.

upstream nuvi_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream apache_svn_backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name svn.example.com;

    # Redirect all HTTP traffic to HTTPS (uncomment in production)
    # return 301 https://$host$request_uri;

    # Increase body size limit for large SVN commits and dumps
    client_max_body_size 2048M;
    client_body_buffer_size 128k;

    # Gzip compression for Web Console and JSON responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 1. Subversion WebDAV Endpoint (Proxied to Apache mod_dav_svn on port 8081)
    location /svn/ {
        proxy_pass http://apache_svn_backend/svn/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebDAV methods and headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;

        # Subversion checkout/commit operations can take hours for large trees
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # 2. Nuvi Management API & Documentation
    location /api/ {
        proxy_pass http://nuvi_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }

    # 3. Health & Liveness Probe
    location /health {
        proxy_pass http://nuvi_backend/health;
        proxy_set_header Host $host;
    }

    # 4. Nuvi Web Administration Console & Web Explorer (SPA)
    location / {
        proxy_pass http://nuvi_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
