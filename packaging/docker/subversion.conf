<Location /svn>
    DAV svn
    SVNParentPath /var/nuvi/repositories
    SVNListParentPath On

    # Fine-grained authorization file generated by Nuvi (Phase 2)
    AuthzSVNAccessFile /var/nuvi/authz

    # Authentication
    AuthType Basic
    AuthName "Subversion Nuvi Repository Access"
    AuthUserFile /var/nuvi/htpasswd
    Require valid-user

    # Enable HTTP compression
    SVNPathAuthz short_circuit
</Location>
