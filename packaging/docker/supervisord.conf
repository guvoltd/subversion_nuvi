[supervisord]
nodaemon=true
user=root
logfile=/var/log/nuvi/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/nuvi/apache_out.log
stderr_logfile=/var/log/nuvi/apache_err.log

[program:nuvi_api]
command=/opt/nuvi/venv/bin/uvicorn backend.api.main:app --host 127.0.0.1 --port 8001 --workers 4
directory=/opt/nuvi
user=subversion
umask=002
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/nuvi/api_out.log
stderr_logfile=/var/log/nuvi/api_err.log

[program:nuvi_worker]
command=/opt/nuvi/venv/bin/python3 -m backend.api.worker
directory=/opt/nuvi
user=subversion
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/nuvi/worker_out.log
stderr_logfile=/var/log/nuvi/worker_err.log
