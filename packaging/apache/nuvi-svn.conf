# Subversion Nuvi - Apache HTTP Server mod_dav_svn Backend Configuration
# Listens on local port 8081 and serves genuine Subversion repositories via WebDAV.
# Directs authentication and path-based authorization to Nuvi's transactional authz compiler.

Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName svn-internal.local

    # Required Apache Modules:
    # LoadModule dav_module modules/mod_dav.so
    # LoadModule dav_svn_module modules/mod_dav_svn.so
    # LoadModule authz_svn_module modules/mod_authz_svn.so

    <Location /svn>
        DAV svn

        # Points directly to Subversion Nuvi's repositories root
        SVNParentPath /opt/nuvi/data/repositories
        SVNListParentPath On

        # Point to Nuvi's transactional compiled Authz file
        AuthzSVNAccessFile /opt/nuvi/data/authz

        # Authentication Provider (linked to Nuvi's user credentials)
        AuthType Basic
        AuthName "Subversion Nuvi Enterprise Repository"
        AuthUserFile /opt/nuvi/data/htpasswd
        
        # Enforce authentication for all write operations, allow read per authz rules
        Require valid-user

        # Auto-versioning and Delta compression settings
        SVNAutoversioning Off
        SVNPathAuthz On
    </Location>

    # Custom Logging for Operational Auditing
    CustomLog /opt/nuvi/data/logs/svn_access.log "%h %l %u %t \"%r\" %>s %b \"%{SVN-ACTION}e\""
    ErrorLog /opt/nuvi/data/logs/svn_error.log
</VirtualHost>
